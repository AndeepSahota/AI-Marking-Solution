name: ai-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      OPENAI_API_KEY: test-dummy-key
      DATALAB_API_KEY: test-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-service-ci-check ./ai-service
